# Keep the pin of the Docker CLI of Devspaces (src/core/docker/dockerCliPin.json,
# docs/architecture.md "The Docker CLI of Devspaces") up to date, once per week
# and on a manual start. The job "pin" first downloads the files of the current
# pin again and fails when Docker replaced one of them, because then the
# extension refuses that download. Then it looks for a newer version that
# download.docker.com has for all platforms of the pin, and computes the size
# and the SHA-256 of each of its files with scripts/docker-cli-pin.mjs. Only
# this job downloads, and it gets no write scope. When the pin changed, the job
# "pull request" commits the new pin to the branch docker-cli-<version>, opens a
# pull request for it, and starts the workflow "CI" on that branch, because a
# pull request of a workflow starts no workflow: the checks of that run appear
# on the pull request, also the job "vscode attach remote", which downloads the
# new version in the window of a devspace on a Docker engine over SSH. A branch
# docker-cli-<version> that has a pull request already, open, closed or merged,
# gets nothing new. Opening the pull request needs the repository setting
# "Allow GitHub Actions to create and approve pull requests" (Settings >
# Actions > General); without it, the job fails after the push, and the next
# run tries again. A pull request that changes this workflow, the script or the
# pin runs the job "pin", which writes nothing there. GitHub starts a scheduled
# run only from the workflow on the default branch.

name: Docker CLI

on:
  schedule:
    # Tuesdays at 04:41 UTC.
    - cron: '41 4 * * 2'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/docker-cli.yml
      - scripts/docker-cli-pin.mjs
      - src/core/docker/dockerCliPin.json

permissions:
  # Checkout needs repository reads; only the job "pull request" gets more.
  contents: read

concurrency:
  group: docker-cli
  cancel-in-progress: false

jobs:
  pin:
    name: pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      version: ${{ steps.update.outputs.version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check the files of the current pin
        run: node scripts/docker-cli-pin.mjs --check

      - name: Look for a newer version
        id: update
        run: |
          node scripts/docker-cli-pin.mjs
          version=$(node -p 'require("./src/core/docker/dockerCliPin.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The pin names the version \"$version\", not x.y.z." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- src/core/docker/dockerCliPin.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The pin has the newest Docker CLI, $version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "The pin changes to the Docker CLI $version:"
              echo
              echo '```diff'
              git diff -- src/core/docker/dockerCliPin.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the new pin
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-cli-pin
          path: src/core/docker/dockerCliPin.json
          if-no-files-found: error

  pull-request:
    name: pull request
    needs: pin
    if: needs.pin.outputs.changed == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The push of the branch docker-cli-<version>.
      contents: write
      # The pull request of that branch.
      pull-requests: write
      # The start of the workflow "CI" on that branch.
      actions: write
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Take the new pin of the job "pin"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docker-cli-pin
          path: src/core/docker

      - name: Push the branch, open the pull request, and start CI on it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.pin.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="docker-cli-$VERSION"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [[ -n "$(git ls-remote --heads "$remote" "refs/heads/$branch")" ]]; then
            if [[ "$(gh pr list --head "$branch" --state all --json number --jq length)" != "0" ]]; then
              echo "The branch $branch has a pull request already." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "The branch $branch exists without a pull request: it gets one now."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git switch --create "$branch"
            git add src/core/docker/dockerCliPin.json
            git commit --quiet --message "Pin the Docker CLI $VERSION" --message "The workflow \"Docker CLI\" computed the sizes and SHA-256 hashes from its download of each file: $RUN_URL"
            git push "$remote" "HEAD:refs/heads/$branch"
          fi
          cat > "$RUNNER_TEMP/body.md" <<EOF
          The workflow "Docker CLI" found the Docker CLI $VERSION on download.docker.com for all platforms of the pin. It downloaded each file, computed its size and SHA-256, and wrote them into \`src/core/docker/dockerCliPin.json\` ([run]($RUN_URL)). Docker publishes no checksums for these files.

          The workflow started the workflow "CI" on this branch, because a pull request of a workflow starts no workflow; its checks appear on this pull request. The job "vscode attach remote" downloads this version in the window of a devspace on a Docker engine over SSH (Linux x86_64), checks it against the pin, and attaches through the Dev Containers extension with it. Merge when CI passes. The next release of Devspaces uses this version.
          EOF
          if ! gh pr create --base main --head "$branch" --title "Pin the Docker CLI $VERSION" --body-file "$RUNNER_TEMP/body.md"; then
            echo "The pull request of $branch could not be opened. Turn on \"Allow GitHub Actions to create and approve pull requests\" in Settings > Actions > General; the next run opens it." >&2
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"
          echo "The pull request of the Docker CLI $VERSION is open, and CI runs on $branch." >> "$GITHUB_STEP_SUMMARY"
