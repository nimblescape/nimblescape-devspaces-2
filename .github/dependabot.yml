# Dependabot. @devcontainers/cli is the version of the Dev Container CLI in the workspace helper:
# it gets a pull request of its own, which CI checks with the contract tests and `npm run test:docker`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        patterns: ['*']
        exclude-patterns:
          - '@devcontainers/cli'
    ignore:
      # @types/vscode stays at the version of engines.vscode, @types/node at Node.js 24, the runtime of VS Code
      # 1.125.
      - dependency-name: '@types/vscode'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # js-yaml 5 refuses the multi-line double-quoted strings of the Compose file that the Dev Container CLI writes,
      # which Docker Compose accepts; the two tests that parse that text stay on js-yaml 4.
      - dependency-name: 'js-yaml'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
